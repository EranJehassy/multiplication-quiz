<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>החידון של אגם</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg: #1b1b2f; --card: #162447; --text: #fff;
            --primary: #e43f5a; --secondary: #1f4068;
            --success: #4caf50; --error: #f44336;
        }
        body {
            background: var(--bg); color: var(--text); font-family: system-ui, sans-serif;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100vh; margin: 0; padding: 15px; box-sizing: border-box;
            position: relative;
        }
        .card {
            background: var(--card); padding: 30px 20px; border-radius: 20px;
            width: 100%; max-width: 400px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
            z-index: 10;
        }
        
        /* עיצוב 10 העיגולים */
        #progress-dots {
            display: flex; justify-content: center; gap: 6px; margin-bottom: 25px;
        }
        .dot {
            width: 28px; height: 28px; border-radius: 50%;
            background: #4a4a6a; color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: bold; transition: background-color 0.4s;
        }
        .dot.green { background: var(--success); }
        .dot.red { background: var(--error); }

        h1 { font-size: 3rem; margin: 10px 0; direction: ltr; }
        .score { font-size: 1.2rem; color: #ffd700; font-weight: bold; margin-bottom: 10px; }
        
        input {
            font-size: 2rem; padding: 15px; width: 80%; text-align: center;
            border: 2px solid var(--secondary); border-radius: 10px;
            background: transparent; color: var(--text); margin-bottom: 15px; outline: none;
        }
        button {
            font-size: 1.2rem; font-weight: bold; padding: 15px; width: 100%;
            border: none; border-radius: 10px; color: white; cursor: pointer;
            margin-bottom: 10px; transition: 0.2s;
        }
        .btn-primary { background: var(--primary); }
        .btn-secondary { background: var(--secondary); font-size: 1rem; }
        #options-stage { display: none; grid-template-columns: 1fr 1fr; gap: 10px; }
        .option-btn { background: var(--secondary); font-size: 1.8rem; padding: 20px; margin: 0; }
        .feedback { height: 24px; color: var(--primary); font-weight: bold; margin-bottom: 10px; }
        
        /* מסך סיכום */
        #summary-stage { display: none; }
        .summary-item { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 10px; border-bottom: 1px solid var(--secondary);
            font-size: 1.2rem; direction: rtl;
        }
        .summary-item span[dir="ltr"] { font-weight: bold; }

        /* קרדיט למפתחת */
        .credit {
            margin-top: 25px;
            font-size: 0.9rem;
            color: var(--text);
            opacity: 0.6;
            text-align: center;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <!-- מסך המשחק -->
    <div class="card" id="game-card">
        <div id="progress-dots"></div> 
        
        <div class="score">ניקוד: <span id="score-display">0</span></div>
        <div class="feedback" id="feedback-msg"></div>
        <h1 id="question-display"></h1> 
        
        <div id="input-stage">
            <input type="number" id="answer-input" inputmode="numeric" pattern="[0-9]*" placeholder="תשובה">
            <button class="btn-primary" onclick="checkInput()">בדקי אותי! (פי 2 נקודות)</button>
            <button class="btn-secondary" onclick="showOptions()">אני צריכה אפשרויות</button>
        </div>

        <div id="options-stage"></div>
    </div>

    <!-- מסך הסיכום שיופיע בסוף -->
    <div class="card" id="summary-stage">
        <h1>כל הכבוד! 🎉</h1>
        <h2>סיימת אימון!</h2>
        <div class="score" style="font-size: 2rem;">ציון סופי: <span id="final-score"></span></div>
        
        <div id="history-list" style="margin: 20px 0; max-height: 250px; overflow-y: auto; background: rgba(0,0,0,0.2); border-radius: 10px;"></div>
        
        <button class="btn-primary" onclick="startGame()">התחלי אימון חדש</button>
    </div>

    <!-- הקרדיט של אגם -->
    <div class="credit">פותח ועוצב ע״י אגם ג'הסי ✨</div>

    <script>
        const TOTAL_QUESTIONS = 10;
        let currentQuestionIndex = 0;
        let score = 0;
        let currentAnswer = 0;
        let currentQuestionText = "";
        let historyList = [];

        function startGame() {
            score = 0;
            currentQuestionIndex = 0;
            historyList = [];
            updateScore();
            
            document.getElementById('summary-stage').style.display = 'none';
            document.getElementById('game-card').style.display = 'block';
            
            const dotsContainer = document.getElementById('progress-dots');
            dotsContainer.innerHTML = '';
            for(let i = 1; i <= TOTAL_QUESTIONS; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot';
                dot.id = 'dot-' + (i - 1); 
                dot.innerText = i;
                dotsContainer.appendChild(dot);
            }

            nextQuestion();
        }

        function nextQuestion() {
            if (currentQuestionIndex >= TOTAL_QUESTIONS) {
                showSummary();
                return;
            }

            const a = Math.floor(Math.random() * 9) + 2;
            const b = Math.floor(Math.random() * 9) + 2;
            currentAnswer = a * b;
            currentQuestionText = `${a} × ${b}`;
            
            document.getElementById('question-display').innerText = `${a} × ${b} = ?`;
            document.getElementById('answer-input').value = '';
            document.getElementById('feedback-msg').innerText = '';
            
            document.getElementById('input-stage').style.display = 'block';
            document.getElementById('options-stage').style.display = 'none';
            document.getElementById('answer-input').focus();
        }

        function checkInput() {
            const userVal = parseInt(document.getElementById('answer-input').value);
            if (userVal === currentAnswer) {
                score += 20;
                updateScore();
                showFeedback('אלופה! נקודות כפולות! 🎉', 'var(--success)');
                
                document.getElementById('dot-' + currentQuestionIndex).classList.add('green');
                historyList.push({ text: currentQuestionText, answer: currentAnswer, points: 20 });
                
                confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, colors: ['#e43f5a', '#ffd700', '#4caf50', '#ffffff'] });

                currentQuestionIndex++;
                setTimeout(nextQuestion, 1500);
            } else {
                showFeedback('כמעט! בואי ננסה עם אפשרויות', 'var(--primary)');
                showOptions();
            }
        }

        function showOptions() {
            document.getElementById('input-stage').style.display = 'none';
            const optionsStage = document.getElementById('options-stage');
            optionsStage.style.display = 'grid';
            optionsStage.innerHTML = '';

            let options = new Set([currentAnswer]);
            while(options.size < 4) {
                let offset = (Math.floor(Math.random() * 3) + 1) * (Math.random() > 0.5 ? 1 : -1);
                let distractor = currentAnswer + offset;
                if(distractor > 0 && !options.has(distractor)) {
                    options.add(distractor);
                }
            }

            const shuffled = Array.from(options).sort(() => Math.random() - 0.5);

            shuffled.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkOption(opt, btn);
                optionsStage.appendChild(btn);
            });
        }

        function checkOption(val, btn) {
            const dot = document.getElementById('dot-' + currentQuestionIndex);
            
            if (val === currentAnswer) {
                btn.style.background = 'var(--success)';
                
                if (!dot.classList.contains('red')) {
                    dot.classList.add('green');
                    score += 10;
                    historyList.push({ text: currentQuestionText, answer: currentAnswer, points: 10 });
                } else {
                    historyList.push({ text: currentQuestionText, answer: currentAnswer, points: 0 });
                }
                
                updateScore();
                confetti({ particleCount: 50, spread: 45, origin: { y: 0.7 } });
                
                currentQuestionIndex++;
                setTimeout(nextQuestion, 1000);
            } else {
                btn.style.background = 'var(--error)';
                dot.classList.add('red');
            }
        }

        function updateScore() {
            document.getElementById('score-display').innerText = score;
        }

        function showFeedback(text, color) {
            const fb = document.getElementById('feedback-msg');
            fb.innerText = text;
            fb.style.color = color;
        }

        function showSummary() {
            document.getElementById('game-card').style.display = 'none';
            document.getElementById('summary-stage').style.display = 'block';
            document.getElementById('final-score').innerText = score;
            
            const listDiv = document.getElementById('history-list');
            listDiv.innerHTML = '';
            
            historyList.forEach(item => {
                const row = document.createElement('div');
                row.className = 'summary-item';
                
                let icon = '❌';
                if (item.points === 20) icon = '🏆';
                if (item.points === 10) icon = '✅';

                row.innerHTML = `
                    <span>${icon} <span style="font-size:0.9rem; color:var(--secondary)">(${item.points} נק')</span></span>
                    <span dir="ltr">${item.text} = ${item.answer}</span>
                `;
                listDiv.appendChild(row);
            });

            var duration = 3000;
            var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#e43f5a', '#ffd700'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#4caf50', '#ffffff'] });
                if (Date.now() < end) { requestAnimationFrame(frame); }
            }());
        }

        startGame();
    </script>
</body>
</html>
